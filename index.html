<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Ulang Tahun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDF2F6; --ink:#10263B; --muted:#4A6178; --panel:#FFFFFF; --line:#C9D6E1;
  --brass:#B8892B; --flame:#E4572E; --cake:#2E4A62; --icing:#F3E3B8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2236; --ink:#EAF1F7; --muted:#9DB3C6; --panel:#16304A; --line:#2B4A66;
    --brass:#D9AE55; --flame:#FF8A4C; --cake:#3D6A8F; --icing:#F3E3B8;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2236; --ink:#EAF1F7; --muted:#9DB3C6; --panel:#16304A; --line:#2B4A66;
  --brass:#D9AE55; --flame:#FF8A4C; --cake:#3D6A8F; --icing:#F3E3B8;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:40px 24px 72px}
h1,h2{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;line-height:1.02;margin:0}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:78vh}
h1{font-weight:800;font-size:clamp(2.6rem,7.5vw,5.6rem);letter-spacing:-.03em}
h1 .nm{color:var(--brass);display:block;overflow-wrap:anywhere}
.sub{color:var(--muted);max-width:46ch;margin:20px 0 28px;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,input,textarea{font:inherit;color:inherit}
.btn{background:var(--brass);color:#10263B;border:0;border-radius:10px;padding:14px 22px;font-weight:700;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.btn:active{transform:translateY(1px)}
label{display:block;font-size:.9rem;color:var(--muted);margin:26px 0 6px}
input{width:min(100%,320px);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
.stage svg{width:100%;max-width:360px;height:auto;cursor:pointer}
.flame{transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.flame:nth-of-type(2n){animation-delay:.3s}
.out .flame{display:none}
.smoke{opacity:0}
.out .smoke{animation:rise 1.6s ease-out forwards}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
@keyframes rise{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
.hint{color:var(--muted);font-size:.95rem;margin-top:10px;min-height:1.6em}
#wishes{display:none;margin-top:24px;border-top:2px solid var(--line);padding-top:48px}
#wishes.show{display:block;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#wishes h2{font-size:clamp(1.8rem,4.5vw,3rem);max-width:18ch;letter-spacing:-.02em}
.list{margin:32px 0 0;padding:0;list-style:none;display:grid;gap:14px;max-width:62ch}
.list li{background:var(--panel);border-left:5px solid var(--brass);border-radius:6px;padding:18px 20px;font-size:1.05rem}
.from{margin-top:28px;color:var(--muted)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
.toast.on{opacity:1}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;min-height:0;gap:28px}
  .stage{order:-1}
  .stage svg{max-width:260px}
}
@media (prefers-reduced-motion:reduce){
  .flame,.out .smoke,#wishes.show{animation:none}
  .out .smoke{opacity:0}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Selamat ulang tahun,<span class="nm" id="nm">Bian</span></h1>
      <p class="sub">Cihuyy</p>
      <div class="row">
        <button class="btn" id="blow" type="button">Tiup lilin</button>
        <button class="btn ghost" id="share" type="button"></button>
      </div>
      <label for="name">Bian</label>
      <input id="name" type="text" maxlength="30" placeholder="Contoh: Andi" autocomplete="off">
    </div>
    <div class="stage">
      <svg id="cake" viewBox="0 0 320 340" role="img" aria-label="Kue ulang tahun dengan lima lilin menyala">
        <ellipse cx="160" cy="316" rx="138" ry="12" fill="var(--line)"/>
        <rect x="40" y="226" width="240" height="84" rx="10" fill="var(--cake)"/>
