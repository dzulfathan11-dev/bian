<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HBD Bian</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEE9FB; --bg2:#DCD2F7; --ink:#1A1038; --muted:#5B4E86; --panel:#FFFFFF;
  --pink:#D6246E; --cyan:#0093B8; --gold:#B7791F; --grid:#9E8CD6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0722; --bg2:#1D0F47; --ink:#F4EFFF; --muted:#B5A6E6; --panel:#1A0E3F;
    --pink:#FF2E88; --cyan:#22E3FF; --gold:#FFD23F; --grid:#7B3FE4;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0722; --bg2:#1D0F47; --ink:#F4EFFF; --muted:#B5A6E6; --panel:#1A0E3F;
  --pink:#FF2E88; --cyan:#22E3FF; --gold:#FFD23F; --grid:#7B3FE4;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;font-weight:500;font-size:1.15rem;line-height:1.45;overflow-x:hidden;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:52vh;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;
  opacity:.55;animation:run 1.6s linear infinite;
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 95%);mask-image:linear-gradient(to top,#000 20%,transparent 95%)}
@keyframes run{to{background-position:0 64px}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 20px 90px}
.hud{display:flex;justify-content:space-between;gap:12px;font-family:Bungee,Impact,sans-serif;font-size:.85rem;color:var(--cyan);letter-spacing:.06em}
.stage{min-height:76vh;display:flex;flex-direction:column;justify-content:center}
.who{font-family:Bungee,Impact,sans-serif;font-size:clamp(1rem,2.6vw,1.4rem);color:var(--muted);margin:0 0 6px}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(4.4rem,22vw,13rem);line-height:.9;letter-spacing:-.01em;
  color:var(--ink);-webkit-text-stroke:3px var(--pink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--pink),12px 12px 0 var(--cyan)}
.tag{font-family:Bungee,Impact,sans-serif;font-size:clamp(1.3rem,4.4vw,2.4rem);margin:26px 0 0;color:var(--gold)}
.xpbox{margin-top:30px;max-width:560px}
.xplabel{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);margin-bottom:6px}
.xp{height:26px;border:3px solid var(--ink);border-radius:6px;background:var(--panel);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 14px,var(--cyan) 14px 28px);transition:width 2.2s cubic-bezier(.3,.7,.2,1)}
.go .xp i{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
button{font:inherit}
.btn{font-family:Bungee,Impact,sans-serif;font-size:1.05rem;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:14px 24px;min-height:52px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:default}
.flash{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.flash span{font-family:Bungee,Impact,sans-serif;font-size:clamp(3rem,16vw,9rem);color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--pink);text-align:center;line-height:1}
.flash.on{animation:fl 1.8s ease both}
@keyframes fl{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#ach{display:none;margin-top:30px}
#ach.show{display:block}
#ach h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(1.6rem,5vw,2.8rem);margin:0 0 10px;color:var(--cyan)}
.rule{margin:0 0 20px;color:var(--muted);max-width:60ch}
.arena{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:26px;align-items:start}
.table{border:3px solid var(--ink);border-radius:10px;background:var(--panel);box-shadow:6px 6px 0 var(--pink);padding:22px 12px 16px}
.shell{position:relative;height:215px;--d:380ms}
.slot{position:absolute;top:0;bottom:0;width:28%;transition:left var(--d) cubic-bezier(.4,0,.2,1)}
.tag{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:Bungee,Impact,sans-serif;background:var(--gold);color:#1A1038;border:3px solid var(--ink);border-radius:6px;padding:4px 10px;font-size:.9rem}
.w .tag{display:block}
.box{position:absolute;left:0;right:0;bottom:0;background:none;border:0;padding:0;cursor:pointer;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.box:disabled{cursor:default}
.box svg{display:block;width:100%;height:auto}
.up .box{transform:translateY(-92px)}
.box:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:8px}
.msg{margin:12px 0 0;text-align:center;font-weight:700;min-height:1.5em}
.tact{display:flex;justify-content:center;margin-top:12px;min-height:56px}
.tact [hidden]{display:none}
.photo{position:relative;aspect-ratio:4/3;border:3px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:6px 6px 0 var(--cyan);background:var(--panel)}
.photo>svg,.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lock{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--bg2) 0 10px,var(--grid) 10px 20px);transition:opacity .9s}
.lock span{font-family:Bungee,Impact,sans-serif;font-size:5rem;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--pink)}
.lock.off{opacity:0;pointer-events:none}
.end{margin-top:22px;font-family:Bungee,Impact,sans-serif;font-size:clamp(1.1rem,3vw,1.6rem);color:var(--gold);min-height:1.6em}
@media (max-width:760px){.arena{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.slot,.box,.lock{transition:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@media (max-width:560px){.a{grid-template-columns:52px 1fr}.ic{width:52px;height:52px}h1{-webkit-text-stroke:2px var(--pink);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan)}}
@media (prefers-reduced-motion:reduce){
  .floor{animation:none}.xp i{transition:none}.flash.on{animation:none;opacity:1}
  .show .a{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"><span>HBD</span></div>

<main class="wrap">
  <div class="hud"><span>Cihuyy</span><span id="lv">Level baru menunggu</span></div>

  <section class="stage" id="stage">
    <p class="who">Selamat ulang tahun</p>
    <h1>Bian</h1>
    <p class="tag">Hari ini kamu naik level.</p>
    <div class="xpbox">
      <div class="xplabel"><span>Pengalaman</span><span id="pct">0%</span></div>
      <div class="xp"><i id="bar"></i></div>
    </div>
    <div class="actions">
      <button class="btn" id="start" type="button">Mulai</button>
    </div>
  </section>

  <section id="ach" aria-live="polite">
    <h2>Misi: tebak kado</h2>
    <p class="rule">Hanya satu kado yang menyimpan hadiahmu. Ingat posisinya, lihat kado diacak, lalu pilih yang benar.</p>
    <div class="arena">
      <div class="table">
        <div class="shell" id="shell"></div>
        <p class="msg" id="msg">Siap, Bian?</p>
        <div class="tact"><button class="btn" id="play" type="button">Main</button></div>
      </div>
      <div class="Hadiah" id="Hadiah">
        <svg viewBox="0 0 400 300" role="img" aria-label="Foto hadiah">
          <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#7B3FE4"/></linearGradient></defs>
          <rect width="400" height="300" fill="url(#pg)"/>
          <rect x="140" y="130" width="120" height="100" rx="6" fill="#1A1038"/><rect x="188" y="130" width="24" height="100" fill="#FFD23F"/>
          <rect x="130" y="104" width="140" height="34" rx="6" fill="#FFD23F"/><rect x="188" y="104" width="24" height="34" fill="#1A1038"/>
          <text x="200" y="64" text-anchor="middle" font-family="Bungee,Impact,sans-serif" font-size="34" fill="#F4EFFF">Selamat!</text>
          <text x="100" y="168" text-anchor="middle" font-family="Bungee,Impact,sans-serif" font-size="15" fill="#F4EFFF">Kecupan Hangat Dari Mas Luminer</text>
        </svg>
        <div class="lock" id="lock"><span>?</span></div>
      </div>
    </div>
    <p class="end" id="end"></p>
  </section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage=$('stage'), started=false;

  var cv=$('fx'), cx=cv.getContext('2d'), parts=[], raf=0;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size(); addEventListener('resize',size);
  var cols=['#FF2E88','#22E3FF','#FFD23F','#F4EFFF','#7B3FE4'];
  function burst(){
    if(reduce)return;
    for(var s=0;s<2;s++){
      for(var i=0;i<90;i++){
        var a=-Math.PI/2+(Math.random()-.5)*1.9, v=8+Math.random()*11;
        parts.push({x:innerWidth*(s?.8:.2),y:innerHeight*.9,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:0});
      }
    }
    if(!raf)loop();
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.y<cv.height+30&&p.l<260});
    parts.forEach(function(p){
      p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.r+=p.vr;p.l++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore();
    });
    raf=parts.length?requestAnimationFrame(loop):0;
  }

  function count(){
    var t0=performance.now(), d=reduce?1:2200, pct=$('pct');
    (function tick(n){
      var k=Math.min(1,(n-t0)/d);
      pct.textContent=Math.round(k*100)+'%';
      if(k<1)requestAnimationFrame(tick);else done();
    })(t0);
  }
  function done(){
    var f=$('flash'); f.classList.add('on');
    $('lv').textContent='Level naik!';
    burst();
    $('ach').classList.add('show');
    $('start').textContent='Ke game';
    $('start').disabled=false;
    setTimeout(function(){$('ach').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})},1500);
  }
  $('start').addEventListener('click',function(){
    if(started){$('ach').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return;}
    started=true;$('start').disabled=true;$('start').textContent='Memuat...';
    stage.classList.add('go');count();
  });

  /* tebak kado */
  (function(){
    var shell=$('shell'), msg=$('msg'), btn=$('play'), slots=[], pos=[0,1,2], win=0, canPick=false, tries=0;
    var svg='<svg viewBox="0 0 120 130" aria-hidden="true"><rect x="10" y="48" width="100" height="78" rx="6" fill="var(--pink)" stroke="var(--ink)" stroke-width="4"/><rect x="52" y="48" width="16" height="78" fill="var(--gold)"/><rect x="4" y="30" width="112" height="28" rx="6" fill="var(--pink)" stroke="var(--ink)" stroke-width="4"/><rect x="52" y="30" width="16" height="28" fill="var(--gold)"/><path d="M60 30C40 4 14 16 30 30zM60 30C80 4 106 16 90 30z" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linejoin="round"/></svg>';
    function wait(ms){return new Promise(function(r){setTimeout(r,reduce?Math.min(ms,60):ms)})}
    function place(){slots.forEach(function(el,i){el.style.left=(2+pos[i]*35)+'%'})}
    function boxes(on){slots.forEach(function(el){el.querySelector('.box').disabled=!on})}
    for(var i=0;i<3;i++){
      var el=document.createElement('div');el.className='slot';
      el.innerHTML='<div class="tag">FOTO</div><button class="box" type="button" aria-label="Kado '+(i+1)+'" disabled>'+svg+'</button>';
      shell.appendChild(el);slots.push(el);
      (function(n){el.querySelector('.box').addEventListener('click',function(){pick(n)})})(i);
    }
    place();
    async function round(){
      canPick=false;btn.hidden=true;boxes(false);
      slots.forEach(function(el){el.classList.remove('up','w')});
      win=Math.floor(Math.random()*3);slots[win].classList.add('w');
      msg.textContent='Ingat kado yang ada Hadiahnya...';
      await wait(500);slots[win].classList.add('up');await wait(1500);slots[win].classList.remove('up');await wait(600);
      slots[win].classList.remove('w');
      msg.textContent='Kadonya diacak...';
      var swaps=7+tries*3, dur=Math.max(170,380-tries*60);
      shell.style.setProperty('--d',dur+'ms');
      for(var s=0;s<swaps;s++){
        var a=Math.floor(Math.random()*3), b=(a+1+Math.floor(Math.random()*2))%3, t=pos[a];
        pos[a]=pos[b];pos[b]=t;place();await wait(dur+70);
      }
      msg.textContent='Pilih kado yang ada Hadiahnya!';
      boxes(true);canPick=true;
    }
    async function pick(n){
      if(!canPick)return;
      canPick=false;boxes(false);
      slots[win].classList.add('w');slots[n].classList.add('up');
      if(n===win){
        msg.textContent='Benar!';await wait(900);
        $('lock').classList.add('off');burst();
        $('end').textContent='Selamat ulang tahun, Bian. Itu hadiahmu!';
        msg.textContent='Hadiah terbuka!';
      }else{
        msg.textContent='Zonk, kosong!';await wait(1000);
        slots[win].classList.add('up');await wait(900);
        tries++;msg.textContent='Hadiah ada di kado yang itu. Coba lagi?';
        btn.textContent='Coba lagi';btn.hidden=false;
      }
    }
    btn.addEventListener('click',round);
  })();
})();
</script>
</body>
</html>
